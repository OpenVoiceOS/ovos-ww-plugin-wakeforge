[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ww-plugin-wakeforge"
dynamic = ["version"]
description = "OVOS wake word plugin for models trained with wakeforge"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"

keywords = [
    "mycroft",
    "ovos",
    "plugin",
    "wake",
    "word",
    "wakeforge",
]
dependencies = [
    "onnxruntime>=1.20",
    "numpy",
    "requests",
    "huggingface_hub>=0.20.0",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-utils>=0.0.14,<1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest<10",
    "onnx",
    "ovoscope>=1.5.0,<1.6.0",
    "wakeforge>=0.6.0a1",
    "soundfile>=0.14.0",
    "rich>=15.0.0",
]
demo = [
    "openwakeword>=0.5.0",
    "pymicro-wakeword>=2.5.0",
    "ovos-ww-plugin-precise-onnx>=0.1.2a1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "rich>=15.0.0",
]

[project.scripts]
ovos-wakeforge-demo = "ovos_ww_plugin_wakeforge.demo:main"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-ww-plugin-wakeforge"
Repository = "https://github.com/OpenVoiceOS/ovos-ww-plugin-wakeforge"

[project.entry-points."opm.wake_word"]
ovos-ww-plugin-wakeforge = "ovos_ww_plugin_wakeforge:WakeForgeHotwordPlugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ovos_ww_plugin_wakeforge = ["models/*.onnx", "models/NOTICE", "featurizers/*/*.onnx", "featurizers/*/config.json", "featurizers/*/NOTICE"]

[tool.setuptools.packages.find]
include = ["ovos_ww_plugin_wakeforge*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_ww_plugin_wakeforge.version.__version__"}
